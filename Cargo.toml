# Cargo.toml

[package]
name = "urlharvest"
version = "2.2.1"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
description = "URL harvester for IRC"
repository = "https://github.com/sjm42/urlharvest-rs"
readme = "README.md"
keywords = ["irc", "url", "harvest", "irssi", "search"]
license = "MIT OR Apache-2.0"
edition = "2024"
resolver = "2"


[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "macros", "query", "tracing"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
enum-iterator = "2.3"
futures = "0.3"
handlebars = "6.4"
html5ever = "0.40"
itertools = "0.15"
linemux = "0.3"
regex = "1.13"
reqwest = { version = "0.13", features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "json",
    "rustls",
    "hickory-dns",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = { version = "3.1", features = ["full"] }
sqlx = { version = "0.9", features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
] }
tera = { version = "2.4", features = ["glob_fs"] }
tokio = { version = "1.54", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
url = "2.5"
# to fix OPNsense/FreeBSD build, sigh
libc = "=0.2.189"


[dev-dependencies]
flate2 = "1.1"

[build-dependencies]
anyhow = "1.0"
build-data = "0.3"


[profile.release]
lto = "fat"
opt-level = 3

# EOF
